[package]
name = "ohmyXJTU"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/TiaoFeng/ohmyXJTU"
description = "A TUI tool for XJTU students"
readme = "README.md"
keywords = ["XJTU", "TUI", "tool"]
license = "BSD 3-Clause"

[lib]
name = "ohmy_xjtu"
path = "src/lib.rs"

[[bin]]
name = "ohmyXJTU"
path = "src/main.rs"

[dependencies]
aes = "0.8"
argon2 = "0.5"
base64 = "0.22"
cfb-mode = "0.8"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29"
dirs = "6"
getrandom = "0.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "charset", "rustls-tls"] }
rsa = "0.9"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3"
thiserror = "2"
unicode-segmentation = "1"
url = "2"
zeroize = { version = "1.9.0", features = ["derive"] }
